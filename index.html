<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AirNav Advance & Extend System</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: #05101e;
  }
  iframe {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: none; display: block;
  }
  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #94ABCA; font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 14px; background: #05101e; z-index: 10;
  }
  noscript { color: #fff; font-family: sans-serif; padding: 2rem; display: block; }
</style>
</head>
<body>
  <div class="loading" id="loading">Memuat aplikasi...</div>

  <!-- GANTI URL DI BAWAH INI dengan Web App URL (exec) dari deployment Apps Script Anda -->
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbxXKewOi6pg4V09TzOaMmUPgsYCHBJ8HZYdTe9jPXKG3xh4TNcEpVv6krwGngUKbbYLaQ/exec"
    title="AirNav Advance & Extend System"
    allow="clipboard-write"
    onload="document.getElementById('loading').style.display='none'">
  </iframe>

  <noscript>JavaScript harus diaktifkan untuk menjalankan aplikasi ini.</noscript>
</body>
</html>
