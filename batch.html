<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Portal Tagihan — AirNav Indonesia</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230D2451'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>A</text></svg>">
<link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Memuat Portal Tagihan...</div>
  </div>
  <div id="wrap"></div>
  <noscript>JavaScript harus diaktifkan untuk melihat tagihan ini.</noscript>

  <script src="/js/config.js"></script>
  <script>
    // Rute /b/:bid/:token → ?batch=1&bid=..&t=..
    window.__EMBED_SPEC__ = {
      buildQuery: function (p) {
        return 'batch=1&bid=' + encodeURIComponent(p.bid || '') +
               '&t=' + encodeURIComponent(p.token || '');
      },
      title: 'Portal Tagihan'
    };
  </script>
  <script src="/js/embed.js"></script>
</body>
</html>
