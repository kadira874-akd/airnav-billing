<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Portal Tagihan — AirNav Indonesia</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230D2451'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>A</text></svg>">
<link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Memuat Portal Tagihan...</div>
  </div>
  <div id="wrap"></div>
  <noscript>JavaScript harus diaktifkan untuk melihat tagihan ini.</noscript>

  <script src="/js/config.js"></script>
  <script>
    // Rute /b/:bid/:token → parse dari pathname ATAU query params
    // Vercel rewrite: /b/:bid/:token → /batch.html?bid=:bid&token=:token
    // Browser URL bar tetap /b/BATCH-ID/TOKEN (clean URL), tapi
    // window.location.search juga punya ?bid=...&token=... dari rewrite.
    window.__EMBED_SPEC__ = {
      buildQuery: function () {
        // Strategi 1: ambil dari pathname (/b/BATCH-ID/TOKEN)
        var parts = window.location.pathname.split('/').filter(Boolean);
        var bid   = parts.length >= 2 ? parts[1] : '';
        var token = parts.length >= 3 ? parts[2] : '';

        // Strategi 2 (fallback): ambil dari query params
        if (!bid || !token) {
          var sp = new URLSearchParams(window.location.search);
          bid   = bid   || sp.get('bid')   || '';
          token = token || sp.get('token') || sp.get('t') || '';
        }

        if (!bid || !token) {
          document.getElementById('loading').innerHTML =
            '<div style="color:#f43f5e;text-align:center;padding:2rem">' +
              '<i class="fas fa-exclamation-triangle" style="font-size:2rem;margin-bottom:1rem;display:block"></i>' +
              '<div style="font-size:1rem;font-weight:700;margin-bottom:.5rem">Link Tidak Lengkap</div>' +
              '<div style="font-size:.82rem;color:#94a3b8">Parameter batch ID atau token tidak ditemukan di URL.</div>' +
            '</div>';
          return '';
        }
        return 'batch=1&bid=' + encodeURIComponent(bid) +
               '&t=' + encodeURIComponent(token);
      },
      title: 'Portal Tagihan'
    };
  </script>
  <script src="/js/embed.js"></script>
</body>
</html>
